name: Publish PixelGuardx Sileo Repo

on:
  push:
    branches: [main]
    paths:
      - 'pool/**'
      - 'source/**'
      - 'generate_repo.py'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixelguardx-pages
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install APT index tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Generate and validate index
        run: |
          python3 generate_repo.py
          grep -q '^Package: com.anth.pixelguard$' site/Packages
          grep -q '^Architecture: iphoneos-arm64$' site/Packages
          test -s site/Release
          test -s site/Packages.gz
          test -s site/Packages.bz2
          test -s site/Packages.xz
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build-index
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy PixelGuardx APT source
        uses: actions/deploy-pages@v4
        id: deployment
